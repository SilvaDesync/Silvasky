<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Coletor Automático</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #181818;
      color: #fff;
      padding: 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .header-status {
      background: #232323;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 13px;
      border-left: 4px solid #4caf50;
    }
    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-record { background: #ff4d29; color: white; }
    .btn-mic { background: #333; color: #ccc; font-size: 13px; padding: 8px; }
    .btn-mic.active { background: #2e7d32; color: white; }
    .logs-box {
      flex: 1;
      background: #101010;
      border-radius: 8px;
      padding: 10px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 11px;
    }
    .log-item {
      padding: 6px 8px;
      margin-bottom: 6px;
      background: #222;
      border-left: 3px solid #2196F3;
      border-radius: 4px;
    }
    .log-item.CONSOLE_ERROR { border-color: #f44336; background: #2a1515; }
  </style>
</head>
<body>

  <div class="header-status">
    🟢 <b>Modo Automático Ativo</b><br>
    <span style="color: #aaa; font-size: 11px;">Basta clicar na página ou programa desejado para iniciar a coleta.</span>
  </div>

  <button id="btn-mic" class="btn-mic active">🎤 Microfone: LIGADO</button>
  <button id="btn-record" class="btn-record">🔴 Iniciar Gravação</button>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
    <span style="font-size: 12px; color: #aaa;">Histórico Único da Sessão:</span>
    <button id="btn-clear" style="width: auto; padding: 4px 8px; font-size: 11px; margin: 0; background: #444;">Limpar</button>
  </div>

  <div id="logs" class="logs-box"></div>

  <script src="renderer.js"></script>
</body>
</html>
