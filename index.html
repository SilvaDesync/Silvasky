<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Error Collector Launcher</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #181818;
      color: #fff;
      padding: 14px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .drop-zone {
      border: 2px dashed #444;
      border-radius: 8px;
      padding: 20px;
      text-align: center;
      background: #222;
      cursor: pointer;
      margin-bottom: 12px;
      transition: all 0.2s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #2196F3;
      background: #1a2733;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-record { background: #ff4d29; color: white; }
    .logs-box {
      flex: 1;
      background: #101010;
      border-radius: 6px;
      padding: 8px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 11px;
    }
    .log-item {
      padding: 6px;
      margin-bottom: 6px;
      background: #222;
      border-left: 3px solid #2196F3;
      border-radius: 4px;
    }
    .log-item.CONSOLE_ERROR { border-color: #f44336; background: #2a1515; }
  </style>
</head>
<body>

  <!-- ÁREA DE DRAG & DROP DO ATALHO -->
  <div id="drop-zone" class="drop-zone">
    📂 <b>Arraste o Atalho / .exe aqui</b><br>
    <span style="font-size: 11px; color: #aaa;">ou clique para selecionar o programa</span>
  </div>

  <button id="btn-record" class="btn-record">🔴 Iniciar Gravação de Tela</button>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
    <span style="font-size: 12px; color: #aaa;">Logs em Tempo Real:</span>
    <button id="btn-clear" style="width: auto; padding: 4px 8px; font-size: 11px; margin: 0; background: #444;">Limpar</button>
  </div>

  <div id="logs" class="logs-box"></div>

  <script src="renderer.js"></script>
</body>
</html>
