<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Coletor Global</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #181818;
      color: #fff;
      padding: 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .card {
      background: #252525;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-record { background: #e53935; color: white; }
    .btn-mic { background: #2e7d32; color: white; }
    .logs {
      flex: 1;
      background: #111;
      border-radius: 6px;
      padding: 8px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 11px;
    }
    .log-item {
      padding: 6px;
      margin-bottom: 6px;
      background: #222;
      border-left: 3px solid #2196F3;
      border-radius: 3px;
      word-break: break-all;
    }
    .log-item.CONSOLE_ERROR { border-color: #f44336; }
  </style>
</head>
<body>

  <div class="card">
    <h3>🔴 Gravação da Tela Inteira</h3>
    <button id="btn-mic" class="btn-mic">🎤 Microfone: ON</button>
    <button id="btn-record" class="btn-record">Iniciar Gravação Global</button>
  </div>

  <div class="card" style="font-size: 12px; background: #332b00; color: #ffeb3b;">
    💡 <b>Como conectar abas do Chrome/Edge:</b><br>
    Arraste o botão do coletor para a barra de favoritos do navegador ou clique no script de injeção quando abrir uma página.
  </div>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
    <span>📜 Histórico Unificado de Logs</span>
    <button id="btn-clear" style="width: auto; padding: 4px 8px; margin: 0;">Limpar</button>
  </div>

  <div id="logs" class="logs"></div>

  <script src="renderer.js"></script>
</body>
</html>
